<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vulcan Setup</title>
<style>
:root{
  --window:#17191d;
  --window2:#14161a;
  --border:#34373d;
  --text:#eeeeee;
  --muted:#92969c;
  --bar:#62c99d;
  --green:#62c99d;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#17191d;
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,
    BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.window{
  width:100%;
  min-height:100%;
  background:linear-gradient(180deg,var(--window),var(--window2));
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}

.compact{
  height:124px;
  padding:16px 17px 13px;
  -webkit-app-region:drag;
}

.top{
  display:grid;
  grid-template-columns:34px 1fr auto;
  gap:12px;
  align-items:center;
}

.icon{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:9px;
  border:1px solid #42454b;
  background:#24262a;
  color:#c8c9cb;
}

.icon svg{
  width:17px;
  height:17px;
}

.eyebrow{
  color:#84898f;
  font-size:10px;
  margin-bottom:2px;
}

.title{
  font-size:12px;
  font-weight:650;
  line-height:1.25;
}

.sub{
  color:#999da2;
  font-size:10px;
  margin-top:4px;
}

.activity{
  color:#a6aaaf;
  font-size:10px;
}

/*
 * Vulcan transfer barber pole, promoted to the entire setup loading bar.
 * The inner layer is deliberately wider than the track and physically
 * translates, matching the transfer UI rather than animating background-position.
 */
.progress{
  position:relative;
  height:8px;
  margin-top:13px;
  border-radius:999px;
  background:#242528;
  border:1px solid #202123;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  overflow:hidden;
  border-radius:inherit;
  background:var(--bar);
  transition:width .24s ease;
}

.stripes{
  height:100%;
  width:calc(100% + 30px);
  background:repeating-linear-gradient(
    125deg,
    rgba(255,255,255,.28) 0 7px,
    rgba(255,255,255,.05) 7px 14px
  );
  animation:barber .7s linear infinite;
}

@keyframes barber{
  from{transform:translateX(-20px)}
  to{transform:translateX(0)}
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}

.hint{
  color:#73787e;
  font-size:9px;
}

.details-link{
  color:#b0b2b5;
  font-size:9px;
  cursor:pointer;
  user-select:none;
  -webkit-app-region:no-drag;
}

.details-link:hover{
  color:white;
}

.drawer{
  max-height:0;
  opacity:0;
  overflow:hidden;
  border-top:0 solid #2b2e33;
  transition:
    max-height .28s ease,
    opacity .18s ease,
    border-top-width .18s ease;
  -webkit-app-region:no-drag;
}

.drawer.open{
  max-height:266px;
  opacity:1;
  border-top-width:1px;
}

.drawer-inner{
  padding:14px 17px 18px;
}

.steps{
  display:grid;
  gap:7px;
}

.step{
  display:grid;
  grid-template-columns:12px 1fr auto;
  gap:8px;
  align-items:center;
  color:#81868c;
  font-size:9px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#3c3f44;
}

.step.done .dot{
  background:#777c82;
}

.step.active .dot{
  background:var(--bar);
  box-shadow:0 0 0 3px rgba(98,201,157,.13);
}

.step.active{
  color:#e7e7e7;
}

.state{
  color:#62676d;
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.step.active .state{
  color:#78c9a8;
}

.step.done .state{
  color:#7f858b;
}

.log{
  margin-top:12px;
  height:120px;
  overflow-y:auto;
  overflow-x:hidden;
  border:1px solid #25272b;
  border-radius:7px;
  background:#0e1012;
  color:#757b82;
  padding:12px 14px 14px;
  font:8.5px/1.55 "Cascadia Code","SFMono-Regular",Consolas,monospace;
  white-space:pre-wrap;
  scrollbar-width:none;
  -ms-overflow-style:none;
}

.log::-webkit-scrollbar{
  width:0;
  height:0;
  display:none;
}

.complete .progress{
  border-color:rgba(98,201,157,.35);
}

.complete .fill{
  width:100% !important;
  background:var(--green);
}

.complete .stripes{
  display:none;
}

.complete .activity{
  color:var(--green);
}

.complete .icon{
  color:var(--green);
  border-color:rgba(98,201,157,.28);
  background:rgba(98,201,157,.06);
}

.complete .icon svg{
  display:none;
}

.complete .icon::before{
  content:"✓";
  font-size:15px;
}
</style>
</head>
<body>

<div class="window" id="window">
  <section class="compact">
    <div class="top">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8">
          <path d="M12 3v12"></path>
          <path d="m7 10 5 5 5-5"></path>
          <path d="M5 20h14"></path>
        </svg>
      </div>

      <div>
        <div class="eyebrow" id="eyebrow">Setting up Vulcan</div>
        <div class="title" id="title">Preparing local runtime</div>
        <div class="sub" id="sub">Checking existing installation…</div>
      </div>

      <div class="activity" id="activity">Working…</div>
    </div>

    <div class="progress">
      <div class="fill" id="progressFill">
        <div class="stripes"></div>
      </div>
    </div>

    <div class="bottom">
      <div class="hint" id="hint">First launch setup</div>
      <div class="details-link" id="detailsLink">Click for details</div>
    </div>
  </section>

  <section class="drawer" id="drawer">
    <div class="drawer-inner">
      <div class="steps" id="steps"></div>
      <div class="log" id="log"></div>
    </div>
  </section>
</div>

<script>
const phases = [
  { key:'checking',  name:'Checking installation' },
  { key:'python',    name:'Preparing Python' },
  { key:'server',    name:'Installing server' },
  { key:'etna',      name:'Checking Etna' },
  { key:'workspace', name:'Preparing workspace' },
  { key:'services',  name:'Starting services' },
];

const state = new Map(phases.map((phase) => [phase.key, 'waiting']));
const groupTotals = new Map();
const taskStates = new Map();

let structuredPlan = false;
let totalIndividualTasks = 0;
let latestDoneTask = 0;
let activeKey = 'checking';
let detailsOpen = false;
let convergenceMode = 'setup';

const root = document.getElementById('window');
const title = document.getElementById('title');
const sub = document.getElementById('sub');
const activity = document.getElementById('activity');
const eyebrow = document.getElementById('eyebrow');
const hint = document.getElementById('hint');
const drawer = document.getElementById('drawer');
const link = document.getElementById('detailsLink');
const steps = document.getElementById('steps');
const log = document.getElementById('log');
const progressFill = document.getElementById('progressFill');

function stamp(){
  return new Date().toLocaleTimeString([], { hour12:false });
}

function appendLog(text){
  if (!text) return;
  log.textContent += `[${stamp()}] ${text}\n`;
  log.scrollTop = log.scrollHeight;
}

function applyContext(payload){
  convergenceMode = String(payload?.mode || 'repair');

  if (convergenceMode === 'update'){
    eyebrow.textContent = 'Finishing update';
    hint.textContent = 'Applying updated runtime';
    appendLog('A newer Vulcan desktop build is converging its local runtime.');
  } else if (convergenceMode === 'repair'){
    eyebrow.textContent = 'Repairing Vulcan';
    hint.textContent = 'Self-repair';
    appendLog('Vulcan found local runtime state that needs repair.');
  } else {
    convergenceMode = 'setup';
    eyebrow.textContent = 'Setting up Vulcan';
    hint.textContent = 'First launch setup';
    appendLog('Beginning first-launch Vulcan setup.');
  }
}

function renderSteps(){
  steps.innerHTML = '';

  for (const phase of phases){
    const row = document.createElement('div');
    const status = state.get(phase.key) || 'waiting';

    row.className = `step ${status}`;
    row.innerHTML =
      `<div class="dot"></div>
       <div>${phase.name}</div>
       <div class="state">${status === 'active' ? 'working' : status}</div>`;

    steps.appendChild(row);
  }
}

function updateProgress(){
  if (structuredPlan){
    latestDoneTask = [...taskStates.values()].filter(
      (task) => task === 'done' || task === 'skipped'
    ).length;
  }

  const ratio = totalIndividualTasks > 0
    ? latestDoneTask / totalIndividualTasks
    : 0;

  progressFill.style.width =
    `${Math.max(0, Math.min(1, ratio)) * 100}%`;
}

function recomputeGroup(group){
  const expected = Number(groupTotals.get(group) || 0);
  const entries = [...taskStates.entries()]
    .filter(([key]) => key.startsWith(`${group}:`))
    .map(([, value]) => value);
  const completed = entries.filter(
    (value) => value === 'done' || value === 'skipped' || value === 'failed'
  ).length;

  if (expected > 0 && completed >= expected) state.set(group, 'done');
  else if (entries.length > 0) state.set(group, 'active');
  else state.set(group, 'waiting');
}

function applyPlan(payload){
  structuredPlan = true;
  taskStates.clear();
  groupTotals.clear();
  totalIndividualTasks = Number(payload?.total || 0);
  latestDoneTask = 0;

  for (const phase of phases){
    state.set(phase.key, 'waiting');
    groupTotals.set(
      phase.key,
      Number(payload?.groups?.[phase.key] || 0),
    );
  }

  renderSteps();
  updateProgress();
}

function applyTask(payload){
  const group = String(payload?.group || '');
  const id = String(payload?.id || '');
  const taskState = String(payload?.state || '');

  if (!state.has(group) || !id) return;
  if (!['running', 'done', 'skipped', 'failed'].includes(taskState)) return;

  taskStates.set(`${group}:${id}`, taskState);
  recomputeGroup(group);

  if (taskState === 'running' || taskState === 'failed'){
    activeKey = group;
    if (payload.title) title.textContent = payload.title;
    if (payload.detail || payload.label){
      sub.textContent = payload.detail || payload.label;
    }
  }

  renderSteps();
  updateProgress();
}

function activateStage(payload){
  if (structuredPlan) return;

  const key = String(payload?.key || '');
  if (!state.has(key)) return;

  if (activeKey && activeKey !== key && state.get(activeKey) === 'active'){
    state.set(activeKey, 'done');
  }

  activeKey = key;
  state.set(key, 'active');

  if (payload.title) title.textContent = payload.title;
  if (payload.detail) sub.textContent = payload.detail;

  totalIndividualTasks = phases.length;
  latestDoneTask = phases.filter(
    (phase) => state.get(phase.key) === 'done'
  ).length;

  renderSteps();
  updateProgress();
}

function complete(){
  for (const phase of phases) state.set(phase.key, 'done');

  if (!totalIndividualTasks) totalIndividualTasks = phases.length;
  latestDoneTask = totalIndividualTasks;
  progressFill.style.width = '100%';

  renderSteps();

  root.classList.add('complete');
  eyebrow.textContent = convergenceMode === 'update'
    ? 'Update complete'
    : convergenceMode === 'repair' ? 'Repair complete' : 'Setup complete';
  title.textContent = 'Vulcan is ready';
  sub.textContent = 'Opening Vulcan…';
  activity.textContent = 'Ready';
  hint.textContent = 'Launching Vulcan';
  appendLog('Vulcan server is healthy. Opening the main window.');
}

link.addEventListener('click', () => {
  detailsOpen = !detailsOpen;
  drawer.classList.toggle('open', detailsOpen);
  link.textContent = detailsOpen ? 'Hide details' : 'Click for details';
  window.vulcanSetup?.setDetailsOpen(detailsOpen);
});

state.set('checking', 'active');
renderSteps();
updateProgress();

window.vulcanSetup?.onProgress((payload) => {
  if (!payload || typeof payload !== 'object') return;

  if (payload.type === 'context'){
    applyContext(payload);
    return;
  }

  if (payload.type === 'plan'){
    applyPlan(payload);
    return;
  }

  if (payload.type === 'task'){
    applyTask(payload);
    return;
  }

  if (payload.type === 'stage'){
    activateStage(payload);
    return;
  }

  if (payload.type === 'log'){
    appendLog(String(payload.line || ''));
    return;
  }

  if (payload.type === 'complete'){
    complete();
  }
});
</script>
</body>
</html>
