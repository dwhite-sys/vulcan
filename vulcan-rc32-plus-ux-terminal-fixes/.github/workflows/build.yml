name: Build Vulcan Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    defaults:
      run:
        working-directory: vulcan-app

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vulcan-app/package-lock.json

      - name: Derive release version from tag
        if: github.ref_type == 'tag'
        run: node scripts/version-from-tag.mjs "${{ github.ref_name }}"

      - name: Version preflight
        run: node scripts/version-regression.mjs

      - name: Update preflight
        run: node scripts/update-regression.mjs

      - name: Packaging preflight
        run: node scripts/packaging-regression.mjs

      - name: Validate headless source bootstrap
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/headless-bootstrap-regression.sh

      - name: Install dependencies
        run: npm ci

      - name: Build packaged desktop artifact
        run: npm run electron:build

      - name: Validate Linux AppImage integration metadata
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail

          src="$(
            find electron-dist -maxdepth 1 -type f \
              -name '*.AppImage' \
              ! -name 'Vulcan.AppImage' \
              -print -quit
          )"

          test -n "$src"
          chmod +x "$src"

          inspect="$(mktemp -d)"
          trap 'rm -rf "$inspect"' EXIT

          (
            cd "$inspect"
            "$GITHUB_WORKSPACE/vulcan-app/$src" --appimage-extract >/dev/null
          )

          desktop="$(
            find "$inspect/squashfs-root" \
              -type f -name '*.desktop' -print -quit
          )"

          test -n "$desktop"
          grep -Fxq 'X-AppImage-Integrate=false' "$desktop"

      - name: Prepare stable Linux release asset
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail

          src="$(
            find electron-dist -maxdepth 1 -type f \
              -name '*.AppImage' \
              ! -name 'Vulcan.AppImage' \
              -print -quit
          )"

          test -n "$src"
          cp "$src" electron-dist/Vulcan.AppImage

      - name: Prepare stable Windows release asset
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $src = Get-ChildItem electron-dist -Filter '*.exe' |
            Where-Object { $_.Name -ne 'Vulcan-Setup.exe' } |
            Select-Object -First 1

          if (-not $src) {
            throw 'No Windows installer was produced'
          }

          Copy-Item $src.FullName electron-dist/Vulcan-Setup.exe

      - name: Prepare stable macOS release asset
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail

          src="$(
            find electron-dist -maxdepth 1 -type f \
              -name '*.dmg' \
              ! -name 'Vulcan.dmg' \
              -print -quit
          )"

          test -n "$src"
          cp "$src" electron-dist/Vulcan.dmg

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Vulcan-Linux
          if-no-files-found: error
          path: vulcan-app/electron-dist/Vulcan.AppImage

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Vulcan-Windows
          if-no-files-found: error
          path: vulcan-app/electron-dist/Vulcan-Setup.exe

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Vulcan-macOS
          if-no-files-found: error
          path: vulcan-app/electron-dist/Vulcan.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release description
        shell: bash
        run: |
          set -euo pipefail

          for asset in \
            Vulcan.AppImage \
            Vulcan-Setup.exe \
            Vulcan.dmg
          do
            test -f "artifacts/$asset"
          done

          {
            echo '### SHA-256'
            echo
            echo '| Asset | SHA-256 |'
            echo '| --- | --- |'

            for asset in \
              Vulcan.AppImage \
              Vulcan-Setup.exe \
              Vulcan.dmg
            do
              hash="$(sha256sum "artifacts/$asset" | awk '{print $1}')"
              printf '| `%s` | `%s` |\n' "$asset" "$hash"
            done

            echo
          } > release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            artifacts/Vulcan.AppImage
            artifacts/Vulcan-Setup.exe
            artifacts/Vulcan.dmg
