name: Build Vulcan Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    defaults:
      run:
        working-directory: vulcan-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vulcan-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build packaged desktop artifact
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stable aliases make the public installers independent of electron-builder's
      # versioned artifact filename. Versioned files are kept beside them for humans.
      - name: Prepare stable Linux release asset
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          src="$(find electron-dist -maxdepth 1 -type f -name '*.AppImage' ! -name 'Vulcan.AppImage' -print -quit)"
          test -n "$src"
          cp "$src" electron-dist/Vulcan.AppImage
          sha256sum electron-dist/Vulcan.AppImage > electron-dist/Vulcan.AppImage.sha256

      - name: Prepare headless server release bundle
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          rm -rf electron-dist/server-bundle
          mkdir -p electron-dist/server-bundle/vulcan-server
          tar -C ../vulcan \
            --exclude='./tests' \
            --exclude='*/__pycache__' \
            --exclude='./.pytest_cache' \
            --exclude='*/.pytest_cache' \
            --exclude='./.mypy_cache' \
            --exclude='*/.mypy_cache' \
            --exclude='*.pyc' \
            --exclude='./SERVER_MANAGEMENT_UI_BACKLOG.md' \
            -cf - . | tar -C electron-dist/server-bundle/vulcan-server -xf -
          cp ../install.sh electron-dist/server-bundle/install.sh
          cp build/server-payload.sha256 electron-dist/server-bundle/server-payload.sha256
          tar -C electron-dist/server-bundle -czf electron-dist/Vulcan-Server.tar.gz \
            install.sh server-payload.sha256 vulcan-server
          sha256sum electron-dist/Vulcan-Server.tar.gz > electron-dist/Vulcan-Server.tar.gz.sha256

      - name: Prepare stable Windows release asset
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $src = Get-ChildItem electron-dist -Filter '*.exe' | Where-Object { $_.Name -ne 'Vulcan-Setup.exe' } | Select-Object -First 1
          if (-not $src) { throw 'No Windows installer was produced' }
          Copy-Item $src.FullName electron-dist/Vulcan-Setup.exe
          $hash = (Get-FileHash electron-dist/Vulcan-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Vulcan-Setup.exe" | Set-Content -NoNewline electron-dist/Vulcan-Setup.exe.sha256

      - name: Prepare stable macOS release asset
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          src="$(find electron-dist -maxdepth 1 -type f -name '*.dmg' ! -name 'Vulcan.dmg' -print -quit)"
          test -n "$src"
          cp "$src" electron-dist/Vulcan.dmg
          shasum -a 256 electron-dist/Vulcan.dmg > electron-dist/Vulcan.dmg.sha256

      - name: Upload Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Vulcan-Linux
          path: |
            vulcan-app/electron-dist/*.AppImage
            vulcan-app/electron-dist/*.AppImage.sha256
            vulcan-app/electron-dist/Vulcan-Server.tar.gz
            vulcan-app/electron-dist/Vulcan-Server.tar.gz.sha256

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Vulcan-Windows
          path: |
            vulcan-app/electron-dist/*.exe
            vulcan-app/electron-dist/*.exe.sha256

      - name: Upload macOS DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Vulcan-macOS
          path: |
            vulcan-app/electron-dist/*.dmg
            vulcan-app/electron-dist/*.dmg.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
