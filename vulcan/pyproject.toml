[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan"
version = "1.0.0rc4"
description = "Vulcan — LLM orchestration server with workspace management and Docker container lifecycle."
requires-python = ">=3.11"
authors = [{ name = "dwhite-sys" }]
keywords = ["llm", "agent", "vulcan", "docker", "workspace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "requests>=2.31.0",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "fastembed>=0.3.6",
    "spacy>=3.8,<3.9",
    "Pillow>=10.0.0",
]

[project.scripts]
vulcan = "vulcan.cli:main"

[project.urls]
Homepage = "https://github.com/dwhite-sys/Vulcan"
Repository = "https://github.com/dwhite-sys/Vulcan"

[tool.setuptools]
packages = ["vulcan"]
package-dir = { vulcan = "." }

[tool.setuptools.package-data]
vulcan = ["agent_assets/*.json", "agent_assets/**/*.json", "agent_assets/**/*.md", "agent_assets/**/*.txt", "agent_assets/**/*.py", "agent_assets/**/*.sh"]
