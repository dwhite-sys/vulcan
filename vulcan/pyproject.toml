[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan"
version = "0.1.0"
description = "Vulcan — LLM orchestration server with workspace management and Docker container lifecycle."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "dwhite-sys" }]
keywords = ["llm", "agent", "vulcan", "docker", "workspace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "requests>=2.31.0",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
]

[project.scripts]
vulcan = "vulcan.cli:main"

[project.urls]
Homepage = "https://github.com/dwhite-sys/Vulcan"
Repository = "https://github.com/dwhite-sys/Vulcan"

[tool.setuptools.packages.find]
where = ["."]
include = ["vulcan*"]
